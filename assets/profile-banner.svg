    <rect x="78" y="70" width="6" height="286" rx="3" fill="#67E8F9"/>
    <rect x="108" y="68" width="218" height="30" rx="15" fill="#0F172A" fill-opacity="0.8" stroke="#A5B4FC" stroke-opacity="0.28"/>
