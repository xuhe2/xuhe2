    <text x="108" y="177" fill="#A5F3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" letter-spacing="4">HELLO, I'M</text>
    <text x="103" y="274" fill="#F8FAFC" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="104" font-weight="800">xuhe</text>
    <rect x="108" y="289" width="230" height="4" rx="2" fill="#67E8F9" fill-opacity="0.72"/>
    <text x="110" y="319" fill="#E2E8F0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="600" letter-spacing="0.2">Backend engineer  ·  AI builder</text>

