<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xuhe — backend and AI builder</title>
  <desc id="desc">A dark gradient banner with a glowing grid, the name xuhe, and a backend engineering and AI research tagline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B18"/>
      <stop offset="0.52" stop-color="#101631"/>
      <stop offset="1" stop-color="#16102B"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="70" x2="1030" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1130 42) rotate(139.2) scale(438 378)">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(330 350) rotate(-31.4) scale(506 314)">
      <stop stop-color="#A855F7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#94A3B8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#background)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#cyanGlow)"/>
    <rect width="1280" height="360" fill="url(#violetGlow)"/>

    <circle cx="1110" cy="42" r="112" fill="#22D3EE" fill-opacity="0.1" filter="url(#blur)"/>
    <circle cx="1110" cy="42" r="4" fill="#A5F3FC" filter="url(#softGlow)"/>
    <circle cx="1070" cy="85" r="2" fill="#C4B5FD"/>
    <circle cx="1162" cy="104" r="3" fill="#F0ABFC"/>

    <path d="M-30 312C160 272 210 340 380 292C548 244 663 274 800 218C956 154 1050 190 1310 106" stroke="url(#accent)" stroke-opacity="0.36" stroke-width="2"/>
    <path d="M-40 334C150 294 210 362 380 314C548 266 663 296 800 240C956 176 1050 212 1310 128" stroke="url(#accent)" stroke-opacity="0.12" stroke-width="7" filter="url(#blur)"/>

    <rect x="70" y="62" width="7" height="236" rx="3.5" fill="url(#accent)"/>
    <text x="112" y="133" fill="#A5F3FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="4">HELLO, I'M</text>
    <text x="108" y="214" fill="white" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="84" font-weight="800" letter-spacing="-4">xuhe</text>
    <text x="114" y="263" fill="#CBD5E1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" letter-spacing="0.5">Backend engineering  ·  LLM / MLLM  ·  AI agents</text>

    <g opacity="0.75">
      <rect x="1020" y="178" width="132" height="132" rx="24" fill="#0F172A" fill-opacity="0.58" stroke="#A5B4FC" stroke-opacity="0.3"/>
      <path d="M1057 220H1116M1057 241H1128M1057 262H1103" stroke="#67E8F9" stroke-width="4" stroke-linecap="round"/>
      <circle cx="1140" cy="220" r="7" fill="#F0ABFC"/>
      <circle cx="1140" cy="241" r="7" fill="#818CF8"/>
      <circle cx="1140" cy="262" r="7" fill="#67E8F9"/>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="358" rx="23" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="2"/>
</svg>
