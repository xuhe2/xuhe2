      <text x="171" y="19" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.2">LLM / MLLM</text>
      <rect x="230" width="104" height="29" rx="14.5" fill="#F0ABFC" fill-opacity="0.1" stroke="#F0ABFC" stroke-opacity="0.4"/>
